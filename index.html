<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>표준 피난안내도 편집기</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;background:#eef1f6;color:#1f2430;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  header{background:#1f2937;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  header h1{font-size:16px;font-weight:700;}
  header .meta{display:flex;gap:8px;align-items:center;font-size:12.5px;color:#c7cede;flex-wrap:wrap;}
  header .meta input{font:inherit;font-size:12.5px;padding:5px 8px;border-radius:7px;border:1px solid #3a475c;background:#111827;color:#fff;}
  header .meta input.b{width:150px;} header .meta input.s{width:64px;}
  header .modeswitch{margin-left:auto;display:flex;gap:6px;background:#0f172a;padding:4px;border-radius:11px;}
  header .mbtn{font:inherit;font-size:13px;font-weight:700;color:#9aa3b5;padding:7px 14px;border:none;border-radius:8px;background:transparent;cursor:pointer;transition:.15s;}
  header .mbtn.active{background:#2563eb;color:#fff;box-shadow:0 2px 10px rgba(37,99,235,.5);}
  .wrap{flex:1;display:flex;min-height:0;}

  .tools{width:190px;flex:none;background:#fff;border-right:1px solid #dde2ea;padding:12px;overflow-y:auto;transition:opacity .15s;}
  .tools h2{font-size:11px;letter-spacing:.4px;color:#8a93a6;text-transform:uppercase;margin:12px 4px 7px;}
  .tools h2:first-child{margin-top:0;}
  .tbtn{width:100%;display:flex;align-items:center;gap:9px;font:inherit;font-size:13.5px;color:#26303f;
        padding:9px 10px;border:1px solid #e2e7ef;border-radius:9px;background:#f7f9fc;cursor:pointer;margin-bottom:6px;transition:.12s;text-align:left;}
  .tbtn:hover{background:#eef3fb;border-color:#c7d3e6;}
  .tbtn.active{background:#2563eb;color:#fff;border-color:#2563eb;box-shadow:0 3px 10px rgba(37,99,235,.35);}
  .tbtn .ic{width:20px;text-align:center;font-size:15px;}
  .sym-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .sym{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:#394353;
       padding:8px 4px;border:1px solid #e2e7ef;border-radius:9px;background:#f7f9fc;cursor:pointer;}
  .sym:hover{background:#eef3fb;} .sym.active{outline:2px solid #2563eb;background:#eaf1ff;}
  .sym canvas{width:34px;height:34px;}

  .stagewrap{flex:1;min-width:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:20px;background:#dfe4ec;}
  #board{background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.18);border-radius:4px;cursor:crosshair;max-width:100%;height:auto;}

  .side{width:212px;flex:none;background:#fff;border-left:1px solid #dde2ea;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;}
  .side h2{font-size:11px;letter-spacing:.4px;color:#8a93a6;text-transform:uppercase;margin:6px 2px 2px;}
  .abtn{font:inherit;font-size:13px;padding:9px;border-radius:9px;border:1px solid #e2e7ef;background:#f7f9fc;cursor:pointer;transition:.12s;}
  .abtn:hover{background:#eef3fb;}
  .abtn.pri{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;border-color:transparent;font-weight:700;}
  .abtn.warn{color:#b42318;}
  .hint{font-size:11.5px;color:#7a8496;line-height:1.6;background:#f4f7fb;border:1px solid #e6ebf3;border-radius:9px;padding:9px 10px;}
  .row2{display:flex;gap:6px;} .row2 .abtn{flex:1;}
  input[type=file]{display:none;}
  select,.side input[type=text]{font:inherit;font-size:13px;padding:8px;border-radius:8px;border:1px solid #d9e0ea;width:100%;}
  .side input[type=range]{width:100%;accent-color:#2563eb;margin:2px 0 4px;}
  .cadlbl{display:block;font-size:11.5px;color:#6b7688;margin:5px 2px 2px;}
</style>
</head>
<body>
<header>
  <h1>🚨 피난안내도 편집기</h1>
  <div class="meta">
    <input class="b" id="mBld" placeholder="건물/사업장명" value="INTS">
    <input class="s" id="mFloor" placeholder="층" value="1F">
    <input class="s" id="mDate" placeholder="작성일" value="">
  </div>
  <div class="modeswitch">
    <button class="mbtn active" id="modePlan">① 평면도 그리기</button>
    <button class="mbtn" id="modePoster">② 안내도 완성</button>
  </div>
</header>

<div class="wrap">
  <div class="tools">
    <h2>도구</h2>
    <button class="tbtn active" data-mode="select"><span class="ic">🖱</span>선택·이동</button>
    <button class="tbtn" data-mode="wall"><span class="ic">🧱</span>외곽선(벽)</button>
    <button class="tbtn" data-mode="route"><span class="ic">➡️</span>피난동선</button>
    <button class="tbtn" data-mode="stair"><span class="ic">🪜</span>계단</button>
    <button class="tbtn" data-mode="text"><span class="ic">🔤</span>방 이름</button>
    <button class="tbtn" data-mode="erase"><span class="ic">🧽</span>지우개</button>

    <h2>표준 심볼</h2>
    <div class="sym-grid" id="symGrid"></div>
  </div>

  <div class="stagewrap">
    <canvas id="board" width="1400" height="920"></canvas>
  </div>

  <div class="side">
    <h2>배경 도면</h2>
    <button class="abtn" onclick="document.getElementById('bgFile').click()">🖼 바닥 도면 이미지</button>
    <input type="file" id="bgFile" accept="image/*">
    <button class="abtn" id="clearBg">배경 지우기</button>

    <h2>방 이름 입력</h2>
    <input type="text" id="textInput" placeholder="예: 사무실 / 회의실 / 창고">

    <h2>편집</h2>
    <div class="row2">
      <button class="abtn" id="undo">↶ 되돌리기</button>
      <button class="abtn warn" id="clearAll">초기화</button>
    </div>

    <h2>선 설정 (CAD)</h2>
    <label class="cadlbl">각도 스냅</label>
    <select id="angleSnap">
      <option value="free">자유 (대각선 O · Shift=직각)</option>
      <option value="ortho">직각 (수평·수직)</option>
      <option value="15">15° 단위</option>
      <option value="30">30° 단위</option>
      <option value="45">45° 단위</option>
    </select>
    <label class="cadlbl">각도 고정(°) · 빈칸=끔</label>
    <input type="text" id="angleLock" placeholder="예: 45  (0=오른쪽, 90=위)">
    <label class="cadlbl">벽 굵기 <b id="wallWv">7</b> px</label>
    <input type="range" id="wallW" min="2" max="16" value="7">
    <label class="cadlbl">동선 굵기 <b id="routeWv">8</b> px</label>
    <input type="range" id="routeW" min="3" max="18" value="8">

    <h2>서버 저장 (클라우드)</h2>
    <input type="text" id="mapName" placeholder="도면 이름 (예: 1공장 1층)">
    <button class="abtn pri" id="cloudSave">☁ 서버에 저장</button>
    <button class="abtn" id="cloudList">☁ 서버에서 불러오기</button>

    <h2>내보내기 / 백업</h2>
    <button class="abtn pri" id="exportPng">🖼 안내도 PNG 저장</button>
    <button class="abtn" id="print">🖨 인쇄 / PDF</button>
    <div class="row2">
      <button class="abtn" id="saveJson">💾 파일백업</button>
      <button class="abtn" onclick="document.getElementById('loadFile').click()">📂 파일열기</button>
    </div>
    <input type="file" id="loadFile" accept="application/json,.json">

    <div class="hint" id="hint">① 평면도 그리기 — 그린 뒤 위쪽 ② 안내도 완성으로. 휠=확대/축소, 가운데버튼 드래그=화면 이동, 0=원래대로.</div>
  </div>
</div>

<div id="cloudModal" style="display:none;position:fixed;inset:0;background:rgba(15,20,30,.5);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:#fff;width:min(620px,94%);max-height:80vh;border-radius:16px;padding:16px;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4);">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <b style="font-size:15px;">☁ 서버에 저장된 피난안내도</b>
      <button id="cloudClose" style="border:none;background:#eef1f6;border-radius:8px;padding:6px 11px;cursor:pointer;font:inherit;">닫기</button>
    </div>
    <div id="cloudItems"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAoPYmhpvYIqx_yYr-Jwm5n2-wdFYtAW_c",authDomain:"ints-weekly.firebaseapp.com",projectId:"ints-weekly",storageBucket:"ints-weekly.firebasestorage.app",messagingSenderId:"421908766897",appId:"1:421908766897:web:f3c4539c61fe3b7ad28290"};
let db=null; try{ db=getFirestore(initializeApp(firebaseConfig)); }catch(e){ console.error('firebase init',e); }
const COL='evac_maps';

const cv=document.getElementById('board'), ctx=cv.getContext('2d');
const W=cv.width, H=cv.height;
const $=id=>document.getElementById(id);

const C={ red:'#e2231a', yellow:'#ffe400', routeGreen:'#8DC63F', exitGreen:'#1a9e46', blue:'#1b3a9e', wall:'#111111' };
const HEADER_H=78, LEFTW=306, LEG_H=58;
const REGX=LEFTW, REGY=HEADER_H, REGW=W-LEFTW, REGH=H-HEADER_H-LEG_H;   // 안내도 가운데(노란) 영역
const PLANW=3000, PLANH=Math.round(3000*REGH/REGW);   // 실제 도면 시트 — 건물 전체를 넓게 그리기 위한 큰 좌표계

(function(){const d=new Date();$('mDate').value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;})();

// ===== 심볼 =====
const SYMBOLS={
  exit_r:{label:'비상구(우)',color:C.exitGreen}, exit_l:{label:'비상구(좌)',color:C.exitGreen},
  fire_ext:{label:'소화기',color:C.red}, alarm:{label:'발신기',color:C.red}, here:{label:'현재위치',color:C.blue},
  restroom:{label:'화장실',color:'#fff'}, elevator:{label:'엘리베이터',color:'#fff'},
  firstaid:{label:'구급함',color:C.exitGreen}, descend:{label:'완강기',color:'#ea580c'}, assembly:{label:'대피장소',color:C.exitGreen},
};
function roundRectPath(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function drawSymbol(g,type,x,y,S,withLabel){
  const def=SYMBOLS[type]||{label:type,color:'#666'}; const c=def.color; const u=S/48;
  const facility=(type==='restroom'||type==='elevator');
  g.save(); roundRectPath(g,x-S/2,y-S/2,S,S,S*0.16);
  if(facility){ g.fillStyle='#fff'; g.fill(); g.lineWidth=Math.max(1.4,S*0.045); g.strokeStyle='#2b2b2b'; g.stroke(); } else { g.fillStyle=c; g.fill(); }
  g.translate(x,y); const wht='#fff'; g.fillStyle=wht; g.strokeStyle=wht; g.lineCap='round'; g.lineJoin='round';
  if(type==='exit_r'||type==='exit_l'){ const dir=type==='exit_r'?1:-1;
    g.save(); g.scale(dir,1);
    g.beginPath(); g.arc(-6*u,-10*u,3.4*u,0,7); g.fill();
    g.lineWidth=3*u; g.beginPath();
    g.moveTo(-6*u,-6*u); g.lineTo(-4*u,3*u); g.moveTo(-6*u,-3*u); g.lineTo(0,-4*u); g.moveTo(-6*u,-3*u); g.lineTo(-11*u,-1*u);
    g.moveTo(-4*u,3*u); g.lineTo(1*u,10*u); g.moveTo(-4*u,3*u); g.lineTo(-9*u,11*u); g.stroke(); g.restore();
    g.lineWidth=2.4*u; g.beginPath(); g.moveTo(10*u*dir,-13*u); g.lineTo(10*u*dir,13*u); g.stroke();
    g.lineWidth=3*u; g.beginPath(); g.moveTo(2*u*dir,10*u); g.lineTo(13*u*dir,10*u); g.stroke();
    g.beginPath(); g.moveTo(15*u*dir,10*u); g.lineTo(9*u*dir,6*u); g.lineTo(9*u*dir,14*u); g.closePath(); g.fill();
  } else if(type==='fire_ext'){ g.lineWidth=2.4*u; roundRectPath(g,-6*u,-6*u,12*u,18*u,3*u); g.fill();
    g.fillRect(-2.4*u,-12*u,4.8*u,6*u); g.lineWidth=2.4*u; g.beginPath(); g.moveTo(2.4*u,-10*u); g.lineTo(11*u,-13*u); g.stroke(); g.beginPath(); g.arc(12*u,-13*u,2.2*u,0,7); g.fill();
  } else if(type==='alarm'){ g.font=`bold ${26*u}px sans-serif`; g.textAlign='center'; g.textBaseline='middle'; g.fillText('B',0,1*u); g.lineWidth=2*u; g.beginPath(); g.arc(0,0,15*u,0,7); g.stroke();
  } else if(type==='here'){ g.beginPath(); g.arc(0,-8*u,4*u,0,7); g.fill(); g.lineWidth=3.4*u; g.beginPath();
    g.moveTo(0,-3*u); g.lineTo(0,7*u); g.moveTo(0,0); g.lineTo(-6*u,3*u); g.moveTo(0,0); g.lineTo(6*u,3*u);
    g.moveTo(0,7*u); g.lineTo(-5*u,14*u); g.moveTo(0,7*u); g.lineTo(5*u,14*u); g.stroke();
  } else if(type==='restroom'){ g.fillStyle=C.blue; g.beginPath(); g.arc(-8*u,-9*u,3*u,0,7); g.fill(); g.fillRect(-10*u,-5*u,4*u,12*u); g.fillRect(-10*u,7*u,1.6*u,7*u); g.fillRect(-7.6*u,7*u,1.6*u,7*u);
    g.fillStyle=C.red; g.beginPath(); g.arc(7*u,-9*u,3*u,0,7); g.fill(); g.beginPath(); g.moveTo(7*u,-5*u); g.lineTo(2.5*u,9*u); g.lineTo(11.5*u,9*u); g.closePath(); g.fill(); g.fillRect(5.6*u,9*u,1.4*u,5*u); g.fillRect(7.6*u,9*u,1.4*u,5*u);
    g.strokeStyle='#bbb'; g.lineWidth=1*u; g.beginPath(); g.moveTo(0,-12*u); g.lineTo(0,12*u); g.stroke();
  } else if(type==='elevator'){ g.fillStyle='#2b2b2b'; g.beginPath(); g.arc(-8*u,-8*u,3*u,0,7); g.fill(); g.fillRect(-10.5*u,-4*u,5*u,11*u); g.fillRect(-10.5*u,7*u,2*u,6*u); g.fillRect(-7.5*u,7*u,2*u,6*u);
    g.beginPath(); g.moveTo(7*u,-12*u); g.lineTo(2.5*u,-5*u); g.lineTo(11.5*u,-5*u); g.closePath(); g.fill(); g.beginPath(); g.moveTo(7*u,12*u); g.lineTo(2.5*u,5*u); g.lineTo(11.5*u,5*u); g.closePath(); g.fill();
  } else if(type==='firstaid'){ g.fillRect(-3.5*u,-12*u,7*u,24*u); g.fillRect(-12*u,-3.5*u,24*u,7*u);
  } else if(type==='descend'){ g.lineWidth=2.4*u; g.beginPath(); g.moveTo(0,-15*u); g.lineTo(0,14*u); g.stroke(); g.beginPath(); g.arc(0,-8*u,3.4*u,0,7); g.fill();
    g.lineWidth=3*u; g.beginPath(); g.moveTo(0,-4*u); g.lineTo(0,6*u); g.moveTo(0,-1*u); g.lineTo(7*u,-3*u); g.moveTo(0,6*u); g.lineTo(6*u,13*u); g.moveTo(0,6*u); g.lineTo(-6*u,13*u); g.stroke();
  } else if(type==='assembly'){ g.beginPath(); g.arc(0,0,3*u,0,7); g.fill();
    const arr=(ax,ay,bx,by)=>{g.lineWidth=2.6*u;g.beginPath();g.moveTo(ax,ay);g.lineTo(bx,by);g.stroke(); const an=Math.atan2(by-ay,bx-ax);g.beginPath();g.moveTo(bx,by); g.lineTo(bx-6*u*Math.cos(an-0.5),by-6*u*Math.sin(an-0.5)); g.lineTo(bx-6*u*Math.cos(an+0.5),by-6*u*Math.sin(an+0.5));g.closePath();g.fill();};
    arr(-14*u,-14*u,-6*u,-6*u);arr(14*u,-14*u,6*u,-6*u);arr(-14*u,14*u,-6*u,6*u);arr(14*u,14*u,6*u,6*u);
  }
  g.restore();
  if(withLabel){ g.save(); const lbl=def.label; g.font='bold 13px "Malgun Gothic",sans-serif';
    const tw=g.measureText(lbl).width, pad=5, ly=y+S/2+4; g.fillStyle='#fff'; g.strokeStyle=facility?'#2b2b2b':c; g.lineWidth=1.5;
    roundRectPath(g,x-tw/2-pad,ly,tw+pad*2,18,4); g.fill(); g.stroke(); g.fillStyle=facility?'#2b2b2b':c; g.textAlign='center'; g.textBaseline='middle'; g.fillText(lbl,x,ly+9); g.restore(); }
}
const symGrid=$('symGrid');
Object.keys(SYMBOLS).forEach(type=>{
  const d=document.createElement('div'); d.className='sym'; d.dataset.type=type;
  const sc=document.createElement('canvas'); sc.width=44;sc.height=44; drawSymbol(sc.getContext('2d'),type,22,22,30,false); d.appendChild(sc);
  const sp=document.createElement('span'); sp.textContent=SYMBOLS[type].label; d.appendChild(sp);
  d.addEventListener('click',()=>{ setMode('symbol'); currentSymbol=type;
    document.querySelectorAll('.sym').forEach(x=>x.classList.remove('active')); d.classList.add('active');
    document.querySelectorAll('.tbtn').forEach(x=>x.classList.remove('active'));
    statusMsg('평면도를 클릭해 「'+SYMBOLS[type].label+'」 배치'); });
  symGrid.appendChild(d);
});

// ===== state / view =====
let state={walls:[],routes:[],symbols:[],texts:[],stairs:[]};
let bgImg=null, bgData=null;
let mode='select', currentSymbol=null;
let draft=null, sel=null, dragOff=null, previewPoint=null;
let history=[];
let viewMode='plan';   // 'plan' | 'poster'
let stairA=null, shiftDown=false;
let zoom=1, panX=0, panY=0, panning=false, panLast=null;

function snapshot(){ history.push(JSON.stringify(state)); if(history.length>40)history.shift(); }
function setMode(m){ mode=m; draft=null; sel=null; previewPoint=null; stairA=null;
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
  if(m!=='symbol'){ document.querySelectorAll('.sym').forEach(x=>x.classList.remove('active')); currentSymbol=null; }
  cv.style.cursor=(m==='select')?'move':(m==='erase')?'not-allowed':'crosshair'; draw();
}
document.querySelectorAll('.tbtn').forEach(b=>b.addEventListener('click',()=>{
  setMode(b.dataset.mode);
  const tips={select:'심볼·방이름을 끌어 이동. 지우려면 지우개.',wall:'클릭으로 점을 이어 그려요(대각선 O, Shift=직각). 오른쪽클릭/Enter/더블클릭=끝, Esc=취소.',
    route:'클릭으로 동선을 이어 찍어요(대각선 O, Shift=직각). 오른쪽클릭/Enter/더블클릭=끝, Esc=취소.',
    stair:'두 점을 클릭해 계단 영역을 지정하면 발판이 그려져요. (Esc=취소)',text:'오른쪽에 방 이름 입력 후 평면도 클릭.',erase:'지울 대상 클릭.'};
  statusMsg(tips[b.dataset.mode]||'');
}));

// ===== 뷰포트 (논리→화면) =====
// 그린 내용의 경계(안내도 자동 맞춤용)
function contentBounds(){
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity,any=false;
  const add=(x,y)=>{ if(x<minX)minX=x; if(y<minY)minY=y; if(x>maxX)maxX=x; if(y>maxY)maxY=y; any=true; };
  const addPts=arr=>arr.forEach(o=>o.points.forEach(p=>add(p.x,p.y)));
  addPts(state.walls); addPts(state.routes);
  (state.stairs||[]).forEach(s=>{ add(s.a.x,s.a.y); add(s.b.x,s.b.y); });
  state.symbols.forEach(s=>{ add(s.x-24,s.y-24); add(s.x+24,s.y+32); });
  state.texts.forEach(t=>add(t.x,t.y));
  if(bgImg){ add(0,0); add(PLANW,PLANH); }
  if(!any) return {x:0,y:0,w:PLANW,h:PLANH};
  const pad=Math.max(maxX-minX,maxY-minY)*0.05+24; minX-=pad;minY-=pad;maxX+=pad;maxY+=pad;
  return {x:minX,y:minY,w:Math.max(1,maxX-minX),h:Math.max(1,maxY-minY)};
}
function viewport(){
  if(viewMode==='poster'){ const b=contentBounds(); const s=Math.min(REGW/b.w,REGH/b.h);
    return {ox:REGX+(REGW-b.w*s)/2-b.x*s, oy:REGY+(REGH-b.h*s)/2-b.y*s, s}; }
  const s=Math.min(W/PLANW,H/PLANH)*0.96*zoom;
  return {ox:(W-PLANW*s)/2+panX, oy:(H-PLANH*s)/2+panY, s};
}
function pos(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H}; }
function toLogical(p){ const v=viewport(); return {x:(p.x-v.ox)/v.s, y:(p.y-v.oy)/v.s}; }
function inPlan(lp){ return lp.x>=0&&lp.x<=PLANW&&lp.y>=0&&lp.y<=PLANH; }
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function segDist(p,a,b){const l2=(a.x-b.x)**2+(a.y-b.y)**2; if(!l2)return dist(p,a);
  let t=((p.x-a.x)*(b.x-a.x)+(p.y-a.y)*(b.y-a.y))/l2; t=Math.max(0,Math.min(1,t));
  return dist(p,{x:a.x+t*(b.x-a.x),y:a.y+t*(b.y-a.y)});}
// 근처 기존 끝점에 붙이기(선 연결용)
function snapEndpoint(p){ let best=null,bd=15;
  const scan=arr=>arr.forEach(o=>{const pts=o.points; [pts[0],pts[pts.length-1]].forEach(pt=>{const d=dist(p,pt); if(d<bd){bd=d;best=pt;}});});
  scan(state.walls); scan(state.routes);
  return best?{x:best.x,y:best.y}:{x:p.x,y:p.y}; }
// CAD식 각도 제약: 끝점 스냅 → 각도 고정 → 각도 스냅
function constrainEnd(start,raw){
  const snapped=snapEndpoint(raw);
  if(snapped.x!==raw.x||snapped.y!==raw.y) return snapped;   // 기존 끝점에 딱 붙기 우선
  const dx=raw.x-start.x, dy=raw.y-start.y, len=Math.hypot(dx,dy);
  const doInc=(inc)=>{ const step=inc*Math.PI/180; const th=Math.round(Math.atan2(dy,dx)/step)*step; return {x:start.x+Math.cos(th)*len, y:start.y+Math.sin(th)*len}; };
  if(shiftDown) return doInc(90);                      // Shift 누르면 그때만 직각
  const lockRaw=($('angleLock').value||'').trim();
  if(lockRaw!==''){ const V=parseFloat(lockRaw);
    if(!isNaN(V)){ const a=V*Math.PI/180; const dir={x:Math.cos(a),y:-Math.sin(a)};
      const proj=dx*dir.x+dy*dir.y; return {x:start.x+dir.x*proj, y:start.y+dir.y*proj}; } }
  const sel=$('angleSnap').value; let inc=0;
  if(sel==='ortho')inc=90; else if(sel==='15')inc=15; else if(sel==='30')inc=30; else if(sel==='45')inc=45;
  if(inc>0) return doInc(inc);
  return {x:raw.x,y:raw.y};                             // 자유 = 대각선 그대로
}

cv.addEventListener('mousedown',e=>{
  if(viewMode!=='plan') return;
  if(e.button===1){ panning=true; panLast=pos(e); e.preventDefault(); return; }   // 가운데버튼 = 화면 이동
  if(e.button!==0) return;
  const p=toLogical(pos(e));
  if(mode==='stair'){ if(!inPlan(p))return;
    if(!stairA){ stairA={x:p.x,y:p.y}; previewPoint={x:p.x,y:p.y}; }
    else { snapshot(); (state.stairs=state.stairs||[]).push({a:stairA,b:{x:p.x,y:p.y}}); stairA=null; previewPoint=null; }
    draw(); return; }
  if(mode==='symbol'&&currentSymbol){ if(!inPlan(p))return; snapshot(); state.symbols.push({type:currentSymbol,x:p.x,y:p.y}); draw(); return; }
  if(mode==='text'){ if(!inPlan(p))return; const t=$('textInput').value.trim()||'방'; snapshot(); state.texts.push({x:p.x,y:p.y,text:t}); draw(); return; }
  if(mode==='wall'||mode==='route'){ if(!inPlan(p))return;
    if(!draft){ draft={type:mode,points:[snapEndpoint(p)]}; previewPoint=draft.points[0]; }
    else { const last=draft.points[draft.points.length-1]; const c=constrainEnd(last,p); draft.points.push(c); previewPoint=c; }
    draw(); return; }
  if(mode==='erase'){ eraseAt(p); return; }
  if(mode==='select'){
    for(let i=state.symbols.length-1;i>=0;i--){ if(dist(p,state.symbols[i])<26){ sel={kind:'sym',i}; dragOff={x:p.x-state.symbols[i].x,y:p.y-state.symbols[i].y}; snapshot(); return; } }
    for(let i=state.texts.length-1;i>=0;i--){ if(dist(p,state.texts[i])<40){ sel={kind:'txt',i}; dragOff={x:p.x-state.texts[i].x,y:p.y-state.texts[i].y}; snapshot(); return; } }
  }
});
cv.addEventListener('mousemove',e=>{
  if(viewMode!=='plan') return;
  if(panning){ const m=pos(e); panX+=m.x-panLast.x; panY+=m.y-panLast.y; panLast=m; draw(); return; }
  const p=toLogical(pos(e));
  if(mode==='stair'&&stairA){ previewPoint={x:p.x,y:p.y}; draw(); return; }
  if(sel){ const o=sel.kind==='sym'?state.symbols[sel.i]:state.texts[sel.i];
    o.x=Math.max(0,Math.min(PLANW,p.x-dragOff.x)); o.y=Math.max(0,Math.min(PLANH,p.y-dragOff.y)); draw(); return; }
  if(draft){ const last=draft.points[draft.points.length-1]; previewPoint=constrainEnd(last,p); draw(); return; }
});
window.addEventListener('mouseup',()=>{ panning=false; sel=null; });
// 휠 확대·축소 (커서 기준)
cv.addEventListener('wheel',e=>{ if(viewMode!=='plan')return; e.preventDefault();
  const m=pos(e), before=toLogical(m);
  zoom=Math.max(0.4,Math.min(6, zoom*(e.deltaY<0?1.12:1/1.12)));
  const a=viewport(); panX+=m.x-(a.ox+before.x*a.s); panY+=m.y-(a.oy+before.y*a.s); draw();
},{passive:false});
// CAD식 선 마무리 / 취소
function finishLine(){ if(draft&&draft.points.length>=2){ snapshot();
    (draft.type==='wall'?state.walls:state.routes).push({points:draft.points.slice(), w:+(draft.type==='wall'?$('wallW').value:$('routeW').value)}); }
  draft=null; previewPoint=null; draw(); }
function cancelLine(){ draft=null; previewPoint=null; draw(); }
function onEsc(){ const was=!!draft||!!stairA; draft=null; previewPoint=null; stairA=null; setMode('select'); statusMsg(was?'취소 · 선택 모드':'선택 모드'); }
cv.addEventListener('contextmenu',e=>{ if(draft){ e.preventDefault(); finishLine(); } });
cv.addEventListener('dblclick',()=>{ if(draft){ const pts=draft.points; if(pts.length>=2){ const a=pts[pts.length-1],b=pts[pts.length-2]; if(Math.hypot(a.x-b.x,a.y-b.y)<3)pts.pop(); } finishLine(); } });
$('wallW').addEventListener('input',()=>{ $('wallWv').textContent=$('wallW').value; });
$('routeW').addEventListener('input',()=>{ $('routeWv').textContent=$('routeW').value; });
function eraseAt(p){ const near=18;
  for(let i=state.symbols.length-1;i>=0;i--) if(dist(p,state.symbols[i])<26){snapshot();state.symbols.splice(i,1);return draw();}
  for(let i=state.texts.length-1;i>=0;i--) if(dist(p,state.texts[i])<40){snapshot();state.texts.splice(i,1);return draw();}
  for(let i=state.routes.length-1;i>=0;i--){const pts=state.routes[i].points; for(let j=0;j<pts.length-1;j++) if(segDist(p,pts[j],pts[j+1])<near){snapshot();state.routes.splice(i,1);return draw();}}
  for(let i=state.walls.length-1;i>=0;i--){const pts=state.walls[i].points; for(let j=0;j<pts.length-1;j++) if(segDist(p,pts[j],pts[j+1])<near){snapshot();state.walls.splice(i,1);return draw();}}
  for(let i=(state.stairs||[]).length-1;i>=0;i--){ const s=state.stairs[i]; const x=Math.min(s.a.x,s.b.x),y=Math.min(s.a.y,s.b.y),w=Math.abs(s.b.x-s.a.x),h=Math.abs(s.b.y-s.a.y);
    const cn=[{x,y},{x:x+w,y},{x:x+w,y:y+h},{x,y:y+h}]; for(let j=0;j<4;j++) if(segDist(p,cn[j],cn[(j+1)%4])<near){snapshot();state.stairs.splice(i,1);return draw();} }
}
window.addEventListener('keydown',e=>{
  const t=document.activeElement; if(t&&['INPUT','SELECT','TEXTAREA'].includes(t.tagName)) return;
  if(e.key==='Escape')onEsc();
  else if(e.key==='Enter')finishLine();
  else if(e.key==='Shift')shiftDown=true;
  else if(e.key==='0'){ zoom=1; panX=0; panY=0; draw(); }
});
window.addEventListener('keyup',e=>{ if(e.key==='Shift')shiftDown=false; });

// ===== 그리기 =====
function drawPolyline(pts,color,w,arrow){
  if(pts.length<2)return; ctx.strokeStyle=color; ctx.lineWidth=w; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y); ctx.stroke();
  if(arrow){ for(let i=1;i<pts.length;i++){ const a=pts[i-1],b=pts[i]; head((a.x+b.x)/2,(a.y+b.y)/2,Math.atan2(b.y-a.y,b.x-a.x),color,w,2.8); }
    const a=pts[pts.length-2],b=pts[pts.length-1]; head(b.x,b.y,Math.atan2(b.y-a.y,b.x-a.x),color,w,4.8); }
}
function head(x,y,an,color,w,mult){ const s=Math.max(w*(mult||2.6),14); ctx.fillStyle=color; ctx.beginPath();
  ctx.moveTo(x,y); ctx.lineTo(x-s*Math.cos(an-0.42),y-s*Math.sin(an-0.42)); ctx.lineTo(x-s*Math.cos(an+0.42),y-s*Math.sin(an+0.42)); ctx.closePath(); ctx.fill(); }
function drawStair(a,b){ const x=Math.min(a.x,b.x),y=Math.min(a.y,b.y),w=Math.abs(b.x-a.x),h=Math.abs(b.y-a.y);
  if(w<3||h<3)return; ctx.strokeStyle=C.wall; ctx.lineJoin='miter'; ctx.lineWidth=2.5; ctx.strokeRect(x,y,w,h);
  ctx.lineWidth=1.6; const horiz=w>=h; const span=horiz?w:h; const n=Math.max(2,Math.round(span/16));
  for(let i=1;i<n;i++){ const t=i/n; ctx.beginPath();
    if(horiz){ ctx.moveTo(x+w*t,y); ctx.lineTo(x+w*t,y+h); } else { ctx.moveTo(x,y+h*t); ctx.lineTo(x+w,y+h*t); } ctx.stroke(); } }

function drawPlanContent(v){
  ctx.save();
  if(viewMode==='poster'){ ctx.beginPath(); ctx.rect(REGX,REGY,REGW,REGH); ctx.clip(); }
  else { ctx.beginPath(); ctx.rect(v.ox,v.oy,PLANW*v.s,PLANH*v.s); ctx.clip(); }
  ctx.translate(v.ox,v.oy); ctx.scale(v.s,v.s);
  if(bgImg){ const s=Math.min(PLANW/bgImg.width,PLANH/bgImg.height)*0.98; const dw=bgImg.width*s,dh=bgImg.height*s;
    ctx.globalAlpha=0.92; ctx.drawImage(bgImg,(PLANW-dw)/2,(PLANH-dh)/2,dw,dh); ctx.globalAlpha=1; }
  (state.stairs||[]).forEach(s=>drawStair(s.a,s.b));
  state.walls.forEach(wl=>drawPolyline(wl.points,C.wall,wl.w||7,false));
  state.routes.forEach(rt=>drawPolyline(rt.points,C.routeGreen,rt.w||8,true));
  state.texts.forEach(t=>{ ctx.font='bold 16px "Malgun Gothic",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    const tw=ctx.measureText(t.text).width; ctx.fillStyle='rgba(255,255,255,.7)'; ctx.fillRect(t.x-tw/2-4,t.y-11,tw+8,22); ctx.fillStyle='#111'; ctx.fillText(t.text,t.x,t.y); });
  state.symbols.forEach(s=>drawSymbol(ctx,s.type,s.x,s.y,42,true));
  if(draft){ const pw=draft.type==='route'?+$('routeW').value:+$('wallW').value; const col=draft.type==='route'?C.routeGreen:C.wall;
    if(draft.points.length>=2) drawPolyline(draft.points,col,pw,draft.type==='route');
    if(previewPoint&&viewMode==='plan'){ const last=draft.points[draft.points.length-1];
      ctx.setLineDash([7,6]); drawPolyline([last,previewPoint],col,pw,false); ctx.setLineDash([]); }
    ctx.fillStyle=col; draft.points.forEach(pt=>{ ctx.beginPath(); ctx.arc(pt.x,pt.y,pw*0.55+1.5,0,7); ctx.fill(); }); }
  if(mode==='stair'&&stairA&&previewPoint&&viewMode==='plan'){ ctx.setLineDash([6,5]); drawStair(stairA,previewPoint); ctx.setLineDash([]); }
  ctx.restore();
}
function wrapText(g,text,x,y,maxW,lh){ const words=text.split(' '); let line='',yy=y;
  for(const wd of words){ const test=line?line+' '+wd:wd; if(g.measureText(test).width>maxW&&line){ g.fillText(line,x,yy); line=wd; yy+=lh; } else line=test; }
  if(line)g.fillText(line,x,yy); return yy; }
const FIRE_STEPS=[['"불이야"라고 외친다.','Shout "fire!"'],['발신기(비상벨)를 누른다.','Press the fire alarm button.'],['피난동선을 따라 낮은 자세로 이동한다.','Go along the evacuation route while lowering your body.'],['계단을 이용하여 대피한다.','Evacuate through the stairs.']];
const EXT_STEPS=[['안전핀을 뽑는다.','Pull the safety pin from the handle.'],['호스를 불쪽으로 향한다.','Aim the nozzle at the base of the fire.'],['손잡이를 눌러 골고루 분사한다.','Squeeze the handle and sweep from side to side.']];
function drawStepList(g,title,titleEn,steps,x,y,w){
  g.fillStyle=C.red; g.fillRect(x,y,w,26); g.fillStyle='#fff'; g.textAlign='left'; g.textBaseline='middle';
  g.font='bold 13px "Malgun Gothic",sans-serif'; g.fillText(title,x+8,y+9); g.font='9px sans-serif'; g.fillText(titleEn,x+8,y+20);
  let cy=y+40;
  steps.forEach((s,i)=>{ g.fillStyle=C.red; g.beginPath(); g.arc(x+15,cy+8,11,0,7); g.fill();
    g.fillStyle='#fff'; g.font='bold 13px sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(String(i+1),x+15,cy+9);
    g.textAlign='left'; g.fillStyle='#1f2430'; g.font='bold 12px "Malgun Gothic",sans-serif'; g.fillText(s[0],x+34,cy+6);
    g.fillStyle='#8a93a6'; g.font='9.5px sans-serif'; const endY=wrapText(g,s[1],x+34,cy+20,w-40,11); cy=Math.max(cy+42,endY+16); });
  return cy;
}
function drawHeader(){ ctx.fillStyle=C.red; ctx.fillRect(0,0,W,HEADER_H); ctx.fillStyle='#fff'; ctx.textBaseline='middle';
  ctx.font='bold 40px "Malgun Gothic",sans-serif'; ctx.textAlign='left'; ctx.fillText('피난안내도',26,HEADER_H/2);
  ctx.font='bold 20px sans-serif'; ctx.fillText('EVACUATION DIAGRAM',280,HEADER_H/2+2);
  ctx.textAlign='right'; ctx.font='bold 20px "Malgun Gothic",sans-serif';
  ctx.fillText(`${$('mBld').value||'____'} 빌딩    ${$('mFloor').value||'__'} 층`,W-26,HEADER_H/2); }
function drawLeftPanel(){ ctx.fillStyle='#fff'; ctx.fillRect(0,HEADER_H,LEFTW,H-HEADER_H);
  ctx.strokeStyle='#e2e7ef'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(LEFTW,HEADER_H); ctx.lineTo(LEFTW,H); ctx.stroke();
  const x=14,w=LEFTW-28; let y=HEADER_H+14; y=drawStepList(ctx,'화재 시 피난요령','HOW TO EVACUATE IN CASE OF FIRE',FIRE_STEPS,x,y,w); y+=14;
  drawStepList(ctx,'소화기 사용요령','HOW TO USE A FIRE EXTINGUISHER',EXT_STEPS,x,y,w); }
function drawLegend(){ const y=H-LEG_H;
  // 좌측: 화재신고 국번없이 119 (빨강 바)
  const bw=286;
  ctx.fillStyle=C.red; ctx.fillRect(LEFTW,y,bw,LEG_H);
  ctx.fillStyle='#fff'; ctx.textBaseline='middle'; ctx.textAlign='left';
  ctx.font='bold 16px "Malgun Gothic",sans-serif';
  ctx.fillText('화재신고는 국번없이',LEFTW+16,y+LEG_H/2);
  const w1=ctx.measureText('화재신고는 국번없이').width;
  ctx.font='800 34px "Malgun Gothic",sans-serif';
  ctx.fillText('119',LEFTW+16+w1+12,y+LEG_H/2+1);

  const items=[{kind:'route'},{type:'here'},{type:'exit_r'},{type:'fire_ext'},{type:'alarm'}];
  const startX=lx0+78, gap=(W-startX-24)/items.length;

  let lx=startX;
  items.forEach(it=>{ const cyc=y+LEG_H/2;
    if(it.kind==='route'){ ctx.strokeStyle=C.routeGreen; ctx.lineWidth=6; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(lx-2,cyc); ctx.lineTo(lx+20,cyc); ctx.stroke();
      ctx.fillStyle=C.routeGreen; ctx.beginPath(); ctx.moveTo(lx+27,cyc); ctx.lineTo(lx+17,cyc-6); ctx.lineTo(lx+17,cyc+6); ctx.closePath(); ctx.fill(); label('피난동선',lx+34,cyc);
    } else { drawSymbol(ctx,it.type,lx+11,cyc,24,false); label(SYMBOLS[it.type].label,lx+28,cyc); } lx+=gap; });

function drawGrid(rx,ry,rw,rh,s){ ctx.save(); ctx.beginPath(); ctx.rect(rx,ry,rw,rh); ctx.clip(); ctx.strokeStyle='#eef1f6'; ctx.lineWidth=1; const g=40*s;
  for(let x=rx;x<=rx+rw;x+=g){ctx.beginPath();ctx.moveTo(x,ry);ctx.lineTo(x,ry+rh);ctx.stroke();}
  for(let y=ry;y<=ry+rh;y+=g){ctx.beginPath();ctx.moveTo(rx,y);ctx.lineTo(rx+rw,y);ctx.stroke();} ctx.restore(); }
// 그리는 중 길이·각도 표시 (CAD 스타일)
function drawReadout(a,b,v){
  const len=Math.hypot(b.x-a.x,b.y-a.y);
  let ang=Math.atan2(-(b.y-a.y),b.x-a.x)*180/Math.PI; if(ang<0)ang+=360;
  const txt=`길이 ${Math.round(len)}  ·  ${ang.toFixed(1)}°`;
  const sx=v.ox+b.x*v.s, sy=v.oy+b.y*v.s;
  ctx.save(); ctx.font='bold 13px "Malgun Gothic",sans-serif'; ctx.textBaseline='middle'; ctx.textAlign='left';
  const tw=ctx.measureText(txt).width, px=Math.min(W-tw-18, sx+16), py=Math.max(22, sy-18);
  ctx.fillStyle='rgba(17,24,39,0.92)'; roundRectPath(ctx,px-7,py-12,tw+14,24,6); ctx.fill();
  ctx.fillStyle='#fff'; ctx.fillText(txt,px,py); ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H); ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  const v=viewport();
  if(viewMode==='poster'){ ctx.fillStyle=C.yellow; ctx.fillRect(REGX,REGY,REGW,REGH); }
  else { const rw=PLANW*v.s, rh=PLANH*v.s; ctx.fillStyle='#fff'; ctx.fillRect(v.ox,v.oy,rw,rh); drawGrid(v.ox,v.oy,rw,rh,v.s); ctx.strokeStyle='#c3ccd8'; ctx.lineWidth=2; ctx.strokeRect(v.ox,v.oy,rw,rh); }
  drawPlanContent(v);
  if(viewMode==='poster'){ drawHeader(); drawLeftPanel(); drawLegend(); }
  else { ctx.fillStyle='#9aa3b5'; ctx.font='bold 14px "Malgun Gothic",sans-serif'; ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillText('① 평면도 그리기 · 휠=확대/축소 · 가운데버튼=이동 · Shift=직각 · 0=원위치',v.ox+2,Math.max(16,v.oy-6)); }
  if(draft&&previewPoint&&viewMode==='plan') drawReadout(draft.points[draft.points.length-1],previewPoint,v);
}

function setView(m){ viewMode=m; draft=null; sel=null; previewPoint=null;
  $('modePlan').classList.toggle('active',m==='plan'); $('modePoster').classList.toggle('active',m==='poster');
  const t=document.querySelector('.tools'); t.style.opacity=m==='plan'?'1':'0.4'; t.style.pointerEvents=m==='plan'?'auto':'none';
  cv.style.cursor=m==='plan'?((mode==='select')?'move':'crosshair'):'default';
  statusMsg(m==='plan'?'① 평면도 그리기 모드 — 도면을 그린 뒤 ②로 넘어가세요.':'② 안내도 완성 — 저장/인쇄하세요. 편집은 ①에서.'); draw();
}
$('modePlan').addEventListener('click',()=>setView('plan'));
$('modePoster').addEventListener('click',()=>setView('poster'));

// ===== 배경/액션 =====
$('bgFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return; const rd=new FileReader(); rd.onload=()=>{ bgData=rd.result; const im=new Image(); im.onload=()=>{bgImg=im;draw();}; im.src=rd.result; }; rd.readAsDataURL(f);});
$('clearBg').addEventListener('click',()=>{bgImg=null;bgData=null;draw();});
$('undo').addEventListener('click',()=>{ if(history.length){ state=JSON.parse(history.pop()); draft=null; draw(); }});
$('clearAll').addEventListener('click',()=>{ snapshot(); state={walls:[],routes:[],symbols:[],texts:[],stairs:[]}; draft=null; draw(); });

// 내보내기는 항상 완성된 안내도(poster)로 렌더
function renderPoster(mime){ const prev=viewMode; viewMode='poster'; draw(); const url=cv.toDataURL(mime||'image/png'); viewMode=prev; draw(); return url; }
$('exportPng').addEventListener('click',()=>{ const a=document.createElement('a'); a.download=`피난안내도_${$('mBld').value}_${$('mFloor').value}.png`; a.href=renderPoster('image/png'); a.click(); });
$('print').addEventListener('click',()=>{ const img=renderPoster('image/png'); const w=window.open(''); w.document.write(`<img src="${img}" style="width:100%"><script>onload=()=>{print()}<\/script>`); w.document.close(); });
$('saveJson').addEventListener('click',()=>{ const data={state,bgData,meta:{b:$('mBld').value,f:$('mFloor').value,d:$('mDate').value}};
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'}); const a=document.createElement('a'); a.download=`피난안내도_${$('mBld').value}.json`; a.href=URL.createObjectURL(blob); a.click(); });
$('loadFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result); state=d.state||state; if(d.meta){$('mBld').value=d.meta.b;$('mFloor').value=d.meta.f;$('mDate').value=d.meta.d;}
    if(d.bgData){bgData=d.bgData;const im=new Image();im.onload=()=>{bgImg=im;draw();};im.src=d.bgData;} else {bgImg=null;draw();}
  }catch(err){alert('파일을 읽을 수 없어요.');}}; rd.readAsText(f);});
['mBld','mFloor','mDate'].forEach(id=>$(id).addEventListener('input',draw));

// ===== 클라우드 =====
function statusMsg(m){ const h=$('hint'); if(h) h.textContent=m; }
function escapeHtml(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function compressedBg(maxDim=1500,quality=0.72){ if(!bgImg) return null; const s=Math.min(1,maxDim/Math.max(bgImg.width,bgImg.height));
  const c=document.createElement('canvas'); c.width=Math.round(bgImg.width*s); c.height=Math.round(bgImg.height*s); c.getContext('2d').drawImage(bgImg,0,0,c.width,c.height);
  try{ return c.toDataURL('image/jpeg',quality); }catch(e){ return null; } }
function makeThumb(w=300){ const prev=viewMode; viewMode='poster'; draw(); const s=w/cv.width; const c=document.createElement('canvas');
  c.width=w; c.height=Math.round(cv.height*s); c.getContext('2d').drawImage(cv,0,0,c.width,c.height); const url=c.toDataURL('image/jpeg',0.6); viewMode=prev; draw(); return url; }
async function cloudSave(){ if(!db){ statusMsg('⚠ 서버 연결이 안 돼요 (인터넷/Firebase 확인).'); return; }
  const nm=($('mapName').value.trim()) || (`${$('mBld').value} ${$('mFloor').value}`.trim()) || '무제';
  let id=nm.replace(/[^\w가-힣ㄱ-ㅎ0-9 _-]/g,'').replace(/\s+/g,'_').slice(0,60); if(!id) id='map_'+Math.floor(performance.now());
  let payload={ name:nm, building:$('mBld').value, floor:$('mFloor').value, date:$('mDate').value, state, bg:compressedBg(), thumb:makeThumb(), ts:Date.now() };
  if(JSON.stringify(payload).length>950000){ payload.bg=null; statusMsg('배경 이미지가 커서 도면 요소만 저장했어요.'); }
  statusMsg('저장 중…'); try{ await setDoc(doc(db,COL,id),payload); statusMsg('☁ 서버에 저장됨 · '+nm); } catch(e){ statusMsg('저장 실패: '+e.message); } }
async function cloudList(){ if(!db){ statusMsg('⚠ 서버 연결이 안 돼요.'); return; } statusMsg('목록 불러오는 중…');
  try{ const snap=await getDocs(collection(db,COL)); const items=[]; snap.forEach(d=>items.push({id:d.id,...d.data()}));
    items.sort((a,b)=>(b.ts||0)-(a.ts||0)); openModal(items); statusMsg('저장된 도면 '+items.length+'개'); }catch(e){ statusMsg('목록 오류: '+e.message); } }
function loadPayload(p){ state=p.state||{walls:[],routes:[],symbols:[],texts:[],stairs:[]}; $('mBld').value=p.building||''; $('mFloor').value=p.floor||''; $('mDate').value=p.date||''; if(p.name)$('mapName').value=p.name;
  if(p.bg){ const im=new Image(); im.onload=()=>{bgImg=im;draw();}; im.src=p.bg; } else { bgImg=null; draw(); } history.length=0; draft=null; draw(); }
async function cloudDelete(id){ try{ await deleteDoc(doc(db,COL,id)); }catch(e){ statusMsg('삭제 실패: '+e.message); } }
function openModal(items){ const box=$('cloudItems'); box.innerHTML='';
  if(!items.length){ box.innerHTML='<div style="color:#8a93a6;padding:18px;text-align:center;">저장된 도면이 없어요.</div>'; $('cloudModal').style.display='flex'; return; }
  box.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:10px;';
  items.forEach(it=>{ const card=document.createElement('div'); card.style.cssText='position:relative;border:1px solid #e6ebf3;border-radius:12px;overflow:hidden;background:#f7f9fc;cursor:pointer;';
    const sub=escapeHtml(((it.building||'')+' '+(it.floor||'')).trim()+(it.date?('  ·  '+it.date):''));
    const thumb=it.thumb?`<img src="${it.thumb}" style="width:100%;height:120px;object-fit:cover;display:block;background:#fff;">`:`<div style="width:100%;height:120px;display:flex;align-items:center;justify-content:center;color:#b8c0cc;font-size:12px;background:#eef1f6;">미리보기 없음</div>`;
    card.innerHTML=`${thumb}<div style="padding:9px 10px;"><b style="font-size:13.5px;color:#26303f;">${escapeHtml(it.name||it.id)}</b><br><span style="font-size:11px;color:#8a93a6;">${sub}</span></div>`;
    card.onclick=()=>{ loadPayload(it); closeModal(); statusMsg('불러옴 · '+(it.name||it.id)); };
    const x=document.createElement('button'); x.textContent='✕'; x.title='삭제'; x.style.cssText='position:absolute;top:6px;right:6px;width:26px;height:26px;border:none;border-radius:8px;background:rgba(255,255,255,.9);color:#c0392b;cursor:pointer;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.2);';
    x.onclick=async(e)=>{ e.stopPropagation(); if(confirm('삭제할까요?')){ await cloudDelete(it.id); card.remove(); } }; card.appendChild(x); box.appendChild(card); });
  $('cloudModal').style.display='flex';
}
function closeModal(){ $('cloudModal').style.display='none'; }
$('cloudSave').addEventListener('click',cloudSave);
$('cloudList').addEventListener('click',cloudList);
$('cloudClose').addEventListener('click',closeModal);
$('cloudModal').addEventListener('click',e=>{ if(e.target===$('cloudModal')) closeModal(); });

draw();
</script>
</body>
</html>
